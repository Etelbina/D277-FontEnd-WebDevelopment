<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover Washington | Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bad+Script&family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">   
</head>

<body>
    <header class="container">
        <div class="site-header">
            <a href="index.html">
                <img src="images/common/logo.png" alt="Discover Washington logo">
            </a>
            <div class="site-branding">
                <h2>Discover Washington</h2>
                <p>Evergreen State's vibrant cities.</p>
            
                <nav aria-label="Primary navigation">
                    <ul>
                        <li><a href="index.html">HOME</a></li>
                        <li><a href="olympia.html">OLYMPIA</a></li>
                        <li><a href="seattle.html">SEATTLE</a></li>
                        <li><a href="bellevue.html">BELLEVUE</a></li>
                        <li><a href="contact.html" aria-current="page">CONTACT</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <div class="container page-content">
        <main class="container">
            <section>
                <h1>Contact</h1>
                <form id="contact-form">
                    <div class="form-field">
                        <label for="first">First Name:</label>
                        <input type="text" id="first" name="first">
                    </div>

                    <div class="form-field">
                        <label for="last">Last Name:</label>
                        <input type="text" id="last" name="last">
                    </div>

                    <div class="form-field">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email">
                    </div>

                    <div class="form-field">
                        <label for="confirmation">Confirm E-mail:</label>
                        <input type="email" id="confirmation" name="confirmation">
                    </div>

                    <div class="form-field">
                        <label for="question">Question:</label>
                        <textarea id="question" 
                                name="question" 
                                rows="4" 
                                placeholder="Type your question..."></textarea>
                    </div>

                    <input type="submit" value="Send message">
                </form>
            </section>

            <footer>
                <section class="internal-links">
                    <ul>
                        <li><a href="about.html">About This Project</a></li>
                        <li><a href="contact.html">Contact</a></li>
                    </ul>
                </section>

                <p>© 2026 Etelbina Cañedo</p>

                <section class="external-links" aria-label="External resources">
                    <p>External Links</p>
                    <ul>
                        <li><a href="https://wa.gov/" target="_blank" rel="noopener">Washington State</a></li>
                        <li><a href="https://www.census.gov/quickfacts/fact/table/WA/PST045225" target="_blank" rel="noopener">Census Bureau</a></li>
                        <li><a href="https://www.weather.gov" target="_blank" rel="noopener">Weather</a></li>
                    </ul>
                </section>
            </footer>
        </main>

        <aside>
            <img src="images/contact/side.png" alt="Wild life watercolor illustration">
        </aside>
    </div>

    <script src="scripts/index.js"></script>
</body>
</html>
